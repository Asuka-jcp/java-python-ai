seed: 42

data:
  root: data
  image_size: 224
  num_workers: 4
  batch_size: 32

model:
  name: resnet18
  num_classes: null
  pretrained: true

train:
  epochs: 15
  lr: 0.0005
  weight_decay: 0.0001
